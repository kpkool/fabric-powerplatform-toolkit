name: Bug report
description: Report reproducible toolkit behavior that differs from its documented outcome.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the toolkit. Use placeholders only. Do not post customer identifiers, endpoints, IP addresses, logs, screenshots, tokens, query results, or correlation IDs.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Delegated subnet validator
        - VNet injection toggle
        - Setup documentation
        - Repository workflow
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed behavior without customer or secret data.
      placeholder: The validator reports ... when ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction
      description: Provide minimal steps with synthetic placeholders.
      placeholder: |
        1. Run ... with <environment-id> and <warehouse-fqdn>.
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
      description: State the documented or intended result.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Local runtime
      description: Provide only product versions, such as PowerShell and module versions.
      placeholder: PowerShell 7.x; Microsoft.PowerPlatform.EnterprisePolicies x.y.z
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Checks already performed
      description: Summarize sanitized checks. Do not paste raw diagnostic output.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data confirmation
      options:
        - label: I removed customer data, identifiers, endpoints, IP addresses, logs, screenshots, query results, and correlation IDs.
          required: true
        - label: I removed credentials, access tokens, secrets, certificates, and connection strings.
          required: true
